<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inference Mastery</title>
<style>
:root{--bg:#fbfaf7;--panel:#f2efe8;--ink:#1d1f23;--muted:#666a73;--line:#e2ddd2;--accent:#b4432b;--code:#f0ece3;--link:#1f5f9e}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--panel:#1c1f23;--ink:#e6e4df;--muted:#9a9ea6;--line:#2c3036;--accent:#e2735a;--code:#22262b;--link:#7fb2e5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 230px;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px}
nav.side h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 4px}
nav.side .sub{font-size:12px;color:var(--muted);margin:0 6px 18px}
nav.side a{display:block;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14.5px}
nav.side a:hover{background:var(--line)}
nav.side a.active{background:var(--accent);color:#fff}
nav.side input{width:100%;padding:8px 10px;margin:0 0 14px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
main{padding:40px 56px 120px;max-width:920px}
aside.toc{position:sticky;top:0;height:100vh;overflow:auto;padding:40px 18px;font-size:13px;border-left:1px solid var(--line)}
aside.toc b{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:8px}
aside.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}
aside.toc a:hover{color:var(--accent)}
h1,h2,h3{line-height:1.25;scroll-margin-top:16px}
main h1{font-size:30px;margin-top:0}
main h2{font-size:22px;margin-top:2.2em;padding-bottom:6px;border-bottom:1px solid var(--line)}
main h3{font-size:17.5px;margin-top:1.7em}
a{color:var(--link)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:var(--code);padding:14px 16px;border-radius:9px;overflow:auto;position:relative}
pre code{padding:0;background:none}
pre button{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover button{opacity:1}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel)}
blockquote{margin:1em 0;padding:4px 16px;border-left:4px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:1em 0}
summary{cursor:pointer;font-weight:600}
li input[type=checkbox]{margin-right:8px;transform:scale(1.15);cursor:pointer}
.pager{display:flex;justify-content:space-between;margin-top:60px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-weight:600}
.progress{font-size:12px;color:var(--muted);margin:-8px 6px 14px}
@media (max-width:1150px){.layout{grid-template-columns:240px minmax(0,1fr)}aside.toc{display:none}}
@media (max-width:760px){.layout{display:block}nav.side{position:static;height:auto}main{padding:24px 18px 80px}}
</style>
</head>
<body>
<div class="layout">
  <nav class="side">
    <h1>Inference Mastery</h1>
    <p class="sub">Production LLM inference runbook</p>
    <input id="q" placeholder="Search all modules…" autocomplete="off">
    <div class="progress" id="progress"></div>
    <div id="nav"></div>
  </nav>
  <main id="content"></main>
  <aside class="toc" id="toc"></aside>
</div>

<script id="docs" type="application/json">{"README.md": {"label": "Overview", "md": "# Inference Mastery \u2014 a self-sufficient runbook for production LLM inference\n\nA hands-on path from \"I can call an LLM API\" to \"I can read a customer's workload, pick the\nright serving trade-off, and spot what will break in production.\" Built from real production\nwork on large GPU fleets (1,000+ GPU deployments, frontier MoE models, disaggregated serving),\nwith exercises you can run today using nothing but Python and a Together AI serverless key.\n\n> Scope: inference engines & serving, inference optimization, the open-model & gateway\n> landscape, and the production/customer lifecycle. Post-training (SFT, LoRA, DPO, RL) is\n> intentionally out of scope for this runbook.\n\n---\n\n## How it's organized\n\n| Module | Covers | Labs |\n|---|---|---|\n| [00 Setup](00_setup.md) | Key, models, costs, conventions, troubleshooting | `common.py --selftest` |\n| [01 Engines & Serving](01_engines_and_serving.md) | Request lifecycle, prefill vs decode, vLLM / SGLang / TRT-LLM / TGI, benchmarking (TTFT, TPS, ITL, goodput), throughput vs latency, engine configuration | `bench.py`, `context_ladder.py` |\n| [02 Inference Optimization](02_inference_optimization.md) | KV cache design, prefix caching (incl. hybrid models), speculative decoding, parallelism, quantization, prefill/decode disaggregation, MoE kernel tuning | `prefix_cache.py`, `spec_probe.py`, `kv_calc.py` |\n| [03 Models, Gateways & Harnesses](03_models_gateways_harnesses.md) | Open-model families, architecture patterns, model selection, model gateways (SMG), parsers & chat templates, agent harnesses | `tool_calls.py` |\n| [04 Production & Customer Lifecycle](04_production_lifecycle.md) | Production readiness, sizing, rollouts & canaries, monitoring & alerting, incident method, customer communication | `monitor.py` |\n| [05 Case Studies](05_case_studies.md) | Ten real incidents/optimizations, each with symptom \u2192 evidence \u2192 root cause \u2192 lesson | read + reproduce |\n| [06 Interview Drills](06_interview_drills.md) | Question bank, whiteboard prompts, customer scenarios, no-AI practice protocol | mock sessions |\n\nEvery concept module follows the same shape: **mental model \u2192 what matters in production \u2192\nlabs \u2192 self-check questions \u2192 \"explain it out loud\" prompt.**\n\n---\n\n## The 4-week path (~60\u201390 min/day)\n\n| Week | Days 1\u20132 | Days 3\u20134 | Day 5 | Weekend |\n|---|---|---|---|---|\n| **1 \u2014 Serving** | 00 Setup, 01 \u00a71\u20133 | Lab 1.1 + 1.2 (`bench.py`) | Lab 1.3 (`context_ladder.py`) + 01 \u00a74\u20136 | Case studies 1\u20133 \u00b7 self-check 01 |\n| **2 \u2014 Optimization** | 02 \u00a71\u20132 (KV, prefix cache) + Lab 2.1 | 02 \u00a73 (spec decode) + Lab 2.2 \u00b7 \u00a74 parallelism | 02 \u00a75\u20137 + Lab 2.3 (`kv_calc.py`) | Case studies 4\u20136 \u00b7 self-check 02 |\n| **3 \u2014 Models & gateways** | 03 \u00a71\u20133 (families, architectures, selection) | 03 \u00a74\u20136 (gateways, templates, harnesses) | Lab 3.1 (`tool_calls.py`) across 3 models | Selection scorecard exercise \u00b7 self-check 03 |\n| **4 \u2014 Production** | 04 \u00a71\u20133 (readiness, sizing, rollouts) | 04 \u00a74\u20136 (monitoring, incidents, comms) + Lab 4.1 | Case studies 7\u201310 | 06 drills: 2 mock sessions, **no AI tools** |\n\nUse the deliverables column in each module as your \"definition of done\". If a week ends\nwithout the deliverables, the week isn't done: extend it rather than skipping ahead.\n\n---\n\n## Readiness checklist\n\nYou're at a good level when you can do all of these **from memory, out loud, without notes**:\n\n**Serving**\n- [ ] Explain why decode is memory-bandwidth-bound and prefill is compute-bound, with the arithmetic.\n- [ ] Define TTFT, TPOT/ITL, TPS, throughput, goodput, and say which one each stakeholder cares about.\n- [ ] Find the concurrency knee of an endpoint and explain what happens to TTFT past it.\n- [ ] Pick between vLLM, SGLang, TRT-LLM and TGI for a given workload and justify it.\n- [ ] Name 6 engine knobs and the trade-off each one controls.\n\n**Optimization**\n- [ ] Compute KV bytes/token for a model from its config, and max concurrency for a GPU shape.\n- [ ] Explain why prefix caching can silently fail on hybrid (Mamba/linear-attention) models.\n- [ ] Explain speculative decoding, acceptance rate, and why it can hurt at high batch.\n- [ ] Choose TP / PP / EP / DP for a model + hardware and explain the communication cost.\n- [ ] Compare FP8, FP4/NVFP4, AWQ/GPTQ and KV-cache quantization, and how you'd validate quality.\n- [ ] Explain prefill/decode disaggregation, when it pays off, and how you'd set the P:D ratio.\n\n**Models & gateways**\n- [ ] Summarize the major open model families and what each is best at.\n- [ ] Recognize dense vs MoE, MLA, GQA, hybrid linear attention, sliding window, MTP from a config.\n- [ ] Walk through a model-selection decision for a customer use case.\n- [ ] Explain what a model gateway does (templating, parsing, routing, admission) and how it fails.\n\n**Production**\n- [ ] Size a deployment from a customer's traffic profile (RPS, tokens in/out, cache rate, SLO).\n- [ ] Design a rollout (canary, blue/green, shadow traffic) and its abort criteria.\n- [ ] Design the 4\u20135 alerts that matter for an endpoint, with thresholds and their failure modes.\n- [ ] Run a structured incident investigation that locates the failing layer with data.\n- [ ] Write a customer update during an incident: what's affected, what you're doing, next update time.\n\n---\n\n## Sources this runbook is built from\n\nHands-on production experience (incidents, optimizations and capacity work on large GPU fleets),\nplus these public references (start here when a module says \"go deeper\"):\n\n- vLLM docs & blog \u2014 https://docs.vllm.ai \u00b7 https://blog.vllm.ai\n- SGLang docs \u2014 https://docs.sglang.ai\n- TensorRT-LLM docs \u2014 https://nvidia.github.io/TensorRT-LLM/\n- NVIDIA Dynamo \u2014 https://github.com/ai-dynamo/dynamo\n- SMG (Shepherd Model Gateway) \u2014 https://github.com/lightseekorg/smg\n- Together AI docs & blog \u2014 https://docs.together.ai \u00b7 https://www.together.ai/blog\n- Lilian Weng \u2014 https://lilianweng.github.io \u00b7 Chip Huyen \u2014 https://huyenchip.com/blog/\n- Hugging Face blog \u2014 https://huggingface.co/blog\n\n> Case studies are anonymized: no customer, company-internal system or infrastructure identifiers.\n> Numbers are kept where they carry the lesson.\n"}, "00_setup.md": {"label": "00 \u00b7 Setup", "md": "# 00 \u2014 Setup\n\nEverything here runs on a laptop with Python 3.9+. No GPU needed: the labs measure a real\nproduction inference service (Together AI serverless) from the outside, and one lab is\npure offline math.\n\n## 1. Get a key and set it\n\n1. Create a key at https://api.together.ai/settings/api-keys (free credits are enough).\n2. Export it in the shell you'll run labs from:\n\n```bash\nexport TOGETHER_API_KEY=...            # never commit it, never paste it in chat\nexport MODEL=zai-org/GLM-5.3-Flash     # optional: default model for every lab\ncd inference-mastery                   # the repo root\npython3 labs/common.py --selftest      # offline sanity check of the parsing code\npython3 labs/kv_calc.py --selftest     # offline sanity check of the memory math\n```\n\n## 2. Pick models deliberately\n\nLabs default to `zai-org/GLM-5.3-Flash`. Swap with `MODEL=...` per run. Choose by what\nthe lab needs, and always check the live list first (models change monthly):\n\n```bash\ncurl -s https://api.together.ai/v1/models -H \"Authorization: Bearer $TOGETHER_API_KEY\" \\\n  -H \"User-Agent: labs\" | python3 -c \"import json,sys; [print(m['id']) for m in json.load(sys.stdin) if m.get('type')=='chat']\"\n```\n\n| Need | Good choices (Nov 2026 catalog) | Why |\n|---|---|---|\n| Cheap default, tool calling, cached pricing | `zai-org/GLM-5.3-Flash` | $0.15 in / $0.50 out / $0.03 cached per 1M |\n| Prefix-cache lab (cache visible + cheap) | `deepseek-ai/DeepSeek-V4.1-Flash`, `MiniMaxAI/MiniMax-M3.1-Flash` | very low cached-input price |\n| Small & fast baseline | `Qwen/Qwen3.5-9B` | small model, compare against MoE giants |\n| Frontier MoE (compare behaviour) | `moonshotai/Kimi-K3.1-Pro`, `zai-org/GLM-5.3`, `meta-models/Muse-Spark-Open-816B-A42B` | large MoE, long context, reasoning |\n| Reasoning with effort control | `openai/gpt-oss-120b` | MXFP4, reasoning effort knob |\n\nModels without a cached-input price (e.g. `Qwen/Qwen3.5-9B`, `openai/gpt-oss-120b`) won't show\ncache savings; use them as a control group in the prefix-cache lab.\n\n## 3. Cost guardrails\n\nRunning **every** lab once on the Flash models costs well under $1. The expensive knobs are\n`context_ladder.py --sizes` with 128k+ prompts on a frontier model, and long `monitor.py` runs\non a frontier model. Check prices on https://docs.together.ai/docs/serverless/models before\npointing a lab at a $3/M-input model.\n\n## 4. Conventions in the labs\n\n- **stdlib only** (`urllib`, `json`, `threading`): nothing to install, nothing hidden.\n- `labs/common.py::chat()` is the single place a request is made. It never raises; errors\n  come back as `ok=False` with `status`, so labs can count 429/503/timeouts.\n- **TTFT counts reasoning tokens.** Reasoning models stream `reasoning_content` before\n  `content`; a TTFT that ignores it measures 0 or infinity. (A real bug we hit in production\n  load tests on Qwen3.5.)\n- **Decode TPS** = `(completion_tokens \u2212 1) / (e2e \u2212 TTFT)`, from server-reported usage.\n- **tokens/chunk** = completion tokens \u00f7 streamed chunks; > ~1.5 hints at speculative decoding.\n- Results append to `labs/results/\u003clab>.csv`, so you can compare runs across days and models.\n\n## 5. Troubleshooting\n\n| Symptom | Cause | Fix |\n|---|---|---|\n| `403 error code: 1010` | Edge (Cloudflare) blocks the default `Python-urllib` User-Agent | `common.py` already sends a custom User-Agent; keep one in your own scripts too |\n| `401 Invalid API key` | Wrong/expired key, or a key scoped to something other than serverless | New key from the settings page |\n| `429` bursts | Your account's serverless rate limit | Lower `--conc`/`--rps`; read `x-ratelimit-*` headers the labs print |\n| `503` under load | Shared serverless capacity is busy (best-effort tier) | Re-run at a quiet hour; that variance *is* the lesson in Lab 1.2 |\n| `cached_tokens` always 0 | Model has no cached pricing, or your prefix isn't byte-stable | See Lab 2.1; try `prompt_cache_key` |\n| TTFT is `-` but request succeeded | Non-streaming call, or a model that sent nothing before finishing | Labs stream by default; check `max_tokens` isn't tiny on a reasoning model |\n\n## 6. Optional: go below the API\n\nThe labs observe a production system from outside. To see the inside, run an engine yourself:\n\n- **vLLM on one GPU:** `pip install vllm`, serve a small Qwen model, then rerun Labs 1.1\u20132.1 against\n  `http://localhost:8000/v1` (set `TOGETHER_BASE_URL`) while changing one engine flag at a time.\n- **SMG on a laptop:** run [SMG](https://github.com/lightseekorg/smg) in front of Ollama with a\n  ~0.5 GB model; no GPU needed. Change routing policies and watch the behaviour change.\n- **Source to read while studying:** [vLLM](https://github.com/vllm-project/vllm),\n  [SGLang](https://github.com/sgl-project/sglang), [TensorRT-LLM](https://github.com/NVIDIA/TensorRT-LLM),\n  [SMG](https://github.com/lightseekorg/smg), [Dynamo](https://github.com/ai-dynamo/dynamo).\n"}, "01_engines_and_serving.md": {"label": "01 \u00b7 Engines & Serving", "md": "# 01 \u2014 Inference Engines & Serving\n\n**Goal:** understand what happens between \"request in\" and \"token out\", measure it honestly,\nand know which engine and which knobs to reach for given a workload.\n\n**Deliverables for this module**\n1. A `labs/results/bench.csv` with a closed-loop sweep and an open-loop sweep on two models.\n2. A one-paragraph written answer: \"Where is this endpoint's concurrency knee, and why there?\"\n3. A context-ladder table showing TTFT vs prompt length, with prefill tok/s.\n4. A one-page engine-selection cheat sheet in your own words (\u00a74).\n\n---\n\n## 1. The request lifecycle\n\n```\nclient\n  \u2192 edge proxy           (TLS, auth at the edge, rate limits, retries, region routing)\n  \u2192 router               (pick a replica: cache-aware / session-aware / least-loaded; admission)\n  \u2192 gateway             (chat template, tokenization, tool/reasoning parsers, streaming)\n  \u2192 engine scheduler     (waiting queue \u2192 running batch; preemption when KV runs out)\n      \u2192 PREFILL          (process the whole prompt in parallel, write its KV cache)\n      \u2192 DECODE loop      (one token per step per sequence, reading all weights + its KV)\n  \u2192 gateway              (detokenize, parse reasoning / tool calls, SSE chunks)\n  \u2192 client\n```\n\nEach hop can fail or add latency on its own, which is why a client-side TTFT alert can fire\nwhile the engine is perfectly healthy (see case study 2 and the TTFT ladder in module 04).\nA typical production stack: an edge proxy (regions, TLS, rate limits) \u2192 an in-datacenter\nrouter (replica selection + admission) \u2192 a gateway in front of each engine (template,\ntokenize, parse) \u2192 the engine (vLLM / SGLang / TRT-LLM). Older stacks add sidecar proxies\nin the pod, and those can mint their own custom error codes.\n\n## 2. Prefill vs decode \u2014 the two workloads inside every request\n\n| | Prefill | Decode |\n|---|---|---|\n| What it does | Processes all prompt tokens at once | Generates one token per step |\n| Bottleneck | **Compute** (big matmuls, high arithmetic intensity) | **Memory bandwidth** (re-read all weights + KV each step) |\n| Shows up as | TTFT | TPOT / ITL, decode tok/s |\n| Scales with | Prompt length (\u2248 linear; attention part quadratic) | Batch size helps throughput, hurts per-user speed slightly |\n\n**The arithmetic you must be able to do on a whiteboard:**\n\n- An 8B model in BF16 is 16 GB. An H100 reads HBM at ~3.35 TB/s. Each decode step reads\n  every weight once \u2192 **~200 steps/s ceiling for a single user** (16 GB \u00f7 3.35 TB/s \u2248 4.8 ms),\n  and the tensor cores sit mostly idle.\n- **Batching** is the fix: one weight read now produces a token for *every* sequence in the\n  batch. That's why throughput rises almost linearly with batch size at first.\n- The catch is the **KV cache**: every running sequence keeps keys/values for all its tokens.\n  Llama-3.1-8B: 2 \u00d7 32 layers \u00d7 8 KV heads \u00d7 128 dim \u00d7 2 bytes = **128 KiB per token**.\n  One user at 128k context = **16 GiB**, as big as the model. Memory, not compute, caps batch size.\n- **MoE models**: compute per token follows *active* params (e.g. A10B of 122B), but **all**\n  experts must sit in GPU memory, and at large batch different tokens hit different experts,\n  so decode reads far more than the active slice.\n\nRun `python3 labs/kv_calc.py --preset llama-3.1-8b --gpus 1 --gpu-mem 80 --context 32000`\nand explain every line of the output.\n\n## 3. What a modern engine does with that\n\n- **Continuous batching:** new requests join the running batch at every step instead of\n  waiting for the slowest sequence. Without it, one long generation stalls everyone.\n- **Paged attention:** KV lives in fixed-size blocks (pages), allocated on demand, so\n  fragmentation drops from ~60\u201380% waste to \u003c4% (the vLLM paper's headline).\n- **Chunked prefill:** long prompts are split into chunks interleaved with decode steps, so\n  a 100k-token prompt doesn't freeze every other user's token stream. The chunk budget\n  (`--max-num-batched-tokens` in vLLM, chunked prefill size in SGLang) trades TTFT of the big\n  request against ITL of everyone else.\n- **CUDA graphs:** decode steps are tiny; launch overhead matters. Engines capture graphs\n  for a set of batch sizes. A decode falling back to eager mode can be 4\u20136\u00d7 slower (a per-pod\n  ITL above ~100 ms is a useful CUDA-graph fallback alarm on large MoE fleets).\n- **Scheduler + preemption:** when the KV pool fills, the scheduler preempts (evicts or swaps)\n  running sequences. Preemption shows up as latency spikes and lost cache, not errors.\n- **Prefix caching (radix / hash-based):** reuse the KV of a shared prompt prefix. Covered in\n  depth in module 02 because it's the single biggest lever in most real workloads.\n\n**Read the source (60 min, highly recommended):** follow one request through vLLM v1:\n`vllm/v1/core/sched/scheduler.py` (`schedule()`: waiting \u2192 running, token budget, preemption)\n\u2192 `vllm/v1/core/kv_cache_manager.py` (`get_computed_blocks` = prefix hits, `allocate_slots`)\n\u2192 `vllm/v1/core/block_pool.py` (free list, eviction, block hashes). Source:\nhttps://github.com/vllm-project/vllm. SGLang equivalents: `python/sglang/srt/managers/scheduler.py`\nand `python/sglang/srt/mem_cache/radix_cache.py`.\n\n## 4. Engine selection\n\n| Engine | Strengths | Watch-outs | Seen in production for |\n|---|---|---|---|\n| **vLLM** | Broadest model support, fastest to support new archs, huge community, V1 scheduler, KV connectors (NIXL, Mooncake, CPU offload), spec decoding (EAGLE/MTP) | Many knobs; defaults rarely optimal for a specific workload | Disaggregated MoE serving with Dynamo + NIXL; a distributed KV cache (Mooncake) behind a gateway |\n| **SGLang** | RadixAttention prefix cache, very strong for agentic/multi-turn, overlap scheduler, fast structured output, good DeepSeek/Qwen support | Hybrid-model knobs (Mamba state) can silently disable caching | Hybrid Qwen3.5 serving behind a gateway (case study 1) |\n| **TensorRT-LLM** | Peak performance on NVIDIA, best low-precision kernels (FP8/NVFP4), mature EAGLE3 + disaggregated serving | Slower to support new architectures; build/config complexity; custom forks | Disaggregated MoE serving with EAGLE3 speculative decoding |\n| **TGI** | Simple, stable, good HF integration | Smaller performance/feature velocity than vLLM/SGLang; check current maintenance status before recommending | Legacy deployments |\n| **NVIDIA Dynamo** (orchestration, not an engine) | Disaggregated prefill/decode, KV-aware routing across engine pools, NIXL KV transfer | Operational complexity (pair rules, partitions, many components) | Large disaggregated MoE fleets |\n| **SMG** (gateway, not an engine) | Rust gateway: templates, tokenization, tool/reasoning parsers, cache-aware routing, gRPC to engines | Parameters can be accepted and dropped between layers | In front of SGLang/vLLM engines |\n\n**How to choose, in order:** (1) Does the engine support the model *well* today (parsers,\nquantization, spec decoding)? (2) What's the workload shape: prefix-heavy agentic \u2192 SGLang/vLLM\nwith strong prefix cache; latency-critical on NVIDIA with a supported model \u2192 TRT-LLM;\nhuge prefill-heavy fleet \u2192 Dynamo PD on vLLM/TRT-LLM. (3) Can your team operate it (images,\nupgrades, debugging)? \"Fastest in a benchmark\" loses to \"we can debug it at 3 a.m.\"\n\n## 5. Benchmarking fundamentals\n\n**Metrics**\n\n| Metric | Definition | Who cares |\n|---|---|---|\n| TTFT | Request sent \u2192 first token (including reasoning tokens) | Chat UX, voice, agents waiting on tools |\n| TPOT / ITL | Time per output token / inter-token latency (p50, p99) | Streaming smoothness |\n| Decode TPS (per request) | \u2248 1 / TPOT | \"How fast does it type\" |\n| E2E latency | Sent \u2192 last token | Batch jobs, non-streaming clients |\n| Throughput | Total output (and input) tokens/s or requests/min across the system | Capacity, cost per token |\n| **Goodput** | Throughput of requests that **met the SLO** (e.g., TTFT p95 \u003c 1 s) | The number that actually matters for sizing |\n| Cache hit rate | cached tokens \u00f7 prompt tokens (token-weighted) | Cost and TTFT on prefix-heavy workloads |\n\n**Rules for honest numbers**\n\n1. **Percentiles, not averages.** Report p50 and p95/p99. A mean TTFT hides the queueing tail.\n2. **Know where you measure.** Client-side TTFT includes the network and every proxy hop;\n   engine-side TTFT doesn't. A TTFT alert measured at the edge proxy sees all of it, so a network\n   problem looks like a slow model unless you split the two.\n3. **Closed loop vs open loop.** Closed loop (N users in a loop) self-throttles: when the\n   server slows, arrivals slow. Open loop (Poisson arrivals) keeps sending, so queueing and\n   429/503s appear exactly like in production. Use closed loop to find the knee, open loop\n   to validate an SLO.\n4. **Control the cache.** Salt prompts at the *start* to defeat prefix caching, or share a\n   prefix on purpose. Never compare a cached run against an uncached one.\n5. **Match the workload shape.** Input/output length distributions, shared-prefix share,\n   multi-turn session churn. We sized one customer on a synthetic shape (~7.3k in, 32 out,\n   ~4k shared system prompt) *and* their real 7-day profile; they gave different answers.\n6. **Compare like with like.** Same timeout (a 60 s vs 240 s client timeout changes success\n   rates), same precision (FP8 *KV cache* is not FP8 *weights*: we caught a \"BF16-optimized\"\n   track that only quantized the KV cache), same context length, same concurrency cap.\n7. **Count tokens from usage, not chunks.** With speculative decoding one SSE chunk can carry\n   several tokens; counting chunks undercounts TPS.\n8. **Don't let the client be the bottleneck.** A laptop that sleeps or drops Wi-Fi voids a\n   run (use `caffeinate -i` on macOS). Client inflight caps (e.g. 192) silently throttle load.\n\n**Tools you should know:** `vllm bench serve`, SGLang `bench_serving`, NVIDIA `genai-perf` /\nAIPerf, and for gateway-level load a traffic simulator with Poisson arrivals, multi-turn sessions,\nand ramp + sustain stages. The labs here are deliberately tiny\nversions of the same ideas.\n\n## 6. Throughput vs latency \u2014 it depends on the workload\n\n| Workload | Shape | Optimize for | Typical levers |\n|---|---|---|---|\n| Chat assistant | Short-medium in, medium out | TTFT p95 + steady TPS | Moderate batch, prefix cache on system prompt |\n| Coding agent | Very long, mostly-shared prefix, many turns | Cache hit rate, TTFT | Cache-aware + session-aware routing, big KV budget, prompt ordering |\n| RAG / document QA | Long unique input, short output | Prefill throughput | Chunked prefill tuning, more prefill capacity, PD disaggregation at scale |\n| Long-context reasoning | Long in, long hidden reasoning | Decode TPS at batch | Spec decoding, FP8/FP4 weights, KV FP8 |\n| Voice (STT/TTS/realtime) | Short, latency-critical | TTFT and *recovery time* | Warm spare capacity, pre-pulled images, low batch |\n| Offline batch | Anything, deadline in hours | Throughput / cost per token | Max batch, aggressive quantization, cheapest GPU |\n\nReal example: one long-context customer runs ~100k-token prompts with ~250-token outputs at\n~95% cache hit. It's prefill-dominated, so the fleet is disaggregated with **2 prefill engines\nper decode engine**, plus a distributed KV store so prefill engines can reuse each other's cache.\n\n## 7. Engine configuration \u2014 the knobs that matter\n\n| Knob (vLLM / SGLang) | Controls | Raise it when | Risk if wrong |\n|---|---|---|---|\n| `--max-num-seqs` / `--max-running-requests` | Max sequences in the running batch | GPU underutilized, KV usage low, queue building | Higher ITL; KV exhaustion \u2192 preemption |\n| `--gpu-memory-utilization` / `--mem-fraction-static` | Share of HBM pre-allocated for weights + KV | KV-bound and activations fit | OOM at warmup or under long prompts |\n| `--max-num-batched-tokens` / chunked prefill size | Tokens processed per step (prefill chunk budget) | TTFT high for long prompts, ITL has headroom | Decode stalls (ITL spikes) during big prefills |\n| `--max-model-len` / `--context-length` | Max sequence length | Customers need longer context | Smaller effective KV pool per sequence; startup OOM |\n| `--kv-cache-dtype fp8` | KV precision | KV-bound, need more concurrency or context | Small quality risk; validate |\n| `--block-size` / `--page-size` | KV block granularity | Aligning with router / KV-store hash blocks (64 is common with distributed KV stores) | Lower cache hit granularity |\n| `--enable-prefix-caching` (vLLM) / radix cache (SGLang default) | Reuse shared-prefix KV | Always for chat/agentic | Hybrid models need extra knobs (module 02) |\n| CUDA-graph batch sizes | Which batch sizes get graphs | Decode at batch sizes outside the captured set | Memory for graphs; eager fallback is slow |\n| `--speculative-config` | Draft method, tokens per step | Decode-bound at low/medium batch | Slower at high batch if acceptance is low |\n| `-tp` / `--enable-expert-parallel` | Parallelism layout | Model doesn't fit / need lower latency | Communication overhead (module 02 \u00a74) |\n| Hybrid-model knobs: `--mamba-scheduler-strategy`, `--max-mamba-cache-size`, SSM state dtype | Recurrent-state memory and prefix-cache support | Qwen3.5-style hybrid models | Silent caps on concurrency; dead prefix cache |\n\n**The lesson from production:** engines often cap you *silently*. On Qwen3.5 in SGLang, effective\nmax running requests = `min(max_running_requests, mamba_slots \u00f7 ratio)`; we configured 128 and\ngot 15\u201322 until we pinned `--max-mamba-cache-size` and halved SSM state with bf16. Always\nconfirm effective limits from **engine startup logs** (`max_total_num_tokens`,\n`max_running_requests`, \"Mamba Cache is allocated\"), never from the config you submitted.\n\n---\n\n## Labs\n\n### Lab 1.1 \u2014 Find the concurrency knee (closed loop)\n\n```bash\npython3 labs/bench.py --conc 1,2,4,8,16 --n 12 --prompt-tokens 2000 --max-tokens 256\nMODEL=Qwen/Qwen3.5-9B python3 labs/bench.py --conc 1,2,4,8,16 --n 12\n```\n\n1. Plot (or eyeball) TTFT p50/p95 and aggregate tok/s against concurrency.\n2. The **knee** is where aggregate throughput stops growing while TTFT keeps rising.\n3. Write down: per-request TPS at conc 1 vs 16. Why does it drop? (shared bandwidth, bigger batch per step)\n4. On shared serverless your \"server\" is a fleet shared with others: note how much noise\n   there is between two identical runs. That variance is part of the answer.\n\n### Lab 1.2 \u2014 Queueing under open-loop load\n\n```bash\npython3 labs/bench.py --rps 0.5,1,2,4 --duration 45 --prompt-tokens 3000\n```\n\n1. Compare TTFT p95 at each rate against Lab 1.1 at similar concurrency. Open loop exposes queueing.\n2. If you see 429/503, read the printed status breakdown. 429 = admission/rate limit (you), 503 =\n   capacity/availability (them). Never lump them together.\n3. Re-run with `--cache shared`. TTFT should drop: you just measured the value of prefix caching.\n\n### Lab 1.3 \u2014 Prompt length vs TTFT\n\n```bash\npython3 labs/context_ladder.py --sizes 1000,8000,32000,64000\n```\n\n1. Is TTFT roughly linear in prompt tokens? Compute prefill tok/s at each size.\n2. Does decode TPS stay flat? At what length does it start to drop, and why (attention reads a bigger KV)?\n3. Run the same ladder on a small model and a frontier MoE. Which one has the better prefill\n   rate per dollar?\n\n### Lab 1.4 \u2014 Read the scheduler (no API)\n\nUsing \u00a73's file list, answer in writing: (a) where does vLLM decide which waiting request runs\nnext? (b) where are prefix-cache hits counted? (c) what happens when `allocate_slots` fails?\n\n---\n\n## Self-check\n\n1. A customer says \"the model got slower\" but GPU utilization is flat. Name three causes and how\n   you'd tell them apart. *(load/queueing, longer prompts, lost cache, network hop, preemption)*\n2. Why can doubling `max_running_requests` *reduce* throughput? *(KV exhaustion \u2192 preemption,\n   recompute; or the engine silently caps it anyway)*\n3. TTFT p50 is fine but p99 is 10\u00d7. What's your first hypothesis? *(queueing or long-prompt prefill\n   interleaving; check prompt-length distribution and waiting queue)*\n4. Why is an open-loop test the right way to validate an SLO?\n5. When would you pick TRT-LLM over vLLM, and what would make you regret it?\n\n**Explain it out loud (2 min, no notes):** \"Walk me through what happens to a 50k-token request\nfrom the moment it arrives until the first token streams back, and where the time goes.\"\n"}, "02_inference_optimization.md": {"label": "02 \u00b7 Optimization", "md": "# 02 \u2014 Inference Optimization\n\n**Goal:** know the five big levers (KV cache, prefix caching, speculative decoding,\nparallelism, quantization) plus disaggregation, well enough to say *which* one fixes a given\ncustomer problem, what it costs, and how you'd prove it worked.\n\n**Deliverables for this module**\n1. `prefix_cache.csv` showing a warm hit, a key on/off comparison, and two deliberately broken caches.\n2. `spec_probe.csv` on two models, with one sentence on whether each speculates.\n3. The sizing worksheet (\u00a78) solved on paper, then checked with `kv_calc.py`.\n4. A P:D ratio recommendation for the worked example in \u00a76, in your own words.\n\n---\n\n## 1. KV cache design\n\n**Size it.** KV bytes/token = 2 \u00d7 layers \u00d7 KV heads \u00d7 head_dim \u00d7 bytes. Attention variants\nexist mostly to shrink this number:\n\n| Attention | KV per token | Example |\n|---|---|---|\n| MHA (every head has K/V) | largest | older models |\n| GQA (groups of query heads share K/V) | \u00f7 (heads / kv_heads) | Llama-3 8B/70B: 8 KV heads \u2192 128 / 320 KiB per token |\n| MLA (compressed latent + small RoPE key) | ~1 latent per layer | DeepSeek-V3: 61 \u00d7 576 \u00d7 2 B \u2248 69 KiB per token |\n| Sliding window | capped at the window | some layers of several hybrid models, Gemma |\n| Linear attention / SSM (Mamba, GDN, KDA) | **fixed state per sequence**, not per token | Qwen3.5 hybrid, Kimi K3 (KDA) |\n\n**Budget it.** KV pool = GPUs \u00d7 HBM \u00d7 mem_fraction \u2212 weights \u2212 activations/graphs. Divide by\nbytes/token = total tokens you can hold; divide by context = concurrent sequences. When the\npool is full the scheduler **preempts**: latency spikes, cache lost, no error returned.\n\n**Shrink it.** FP8 KV cache halves bytes/token (usually small quality impact; validate it).\nProduction data point: KV-FP8 on a 1\u00d7B200 Qwen3.5 deployment added ~0 throughput (the\ndeployment was prefill-compute-bound) but **cut cache eviction from ~20% to ~9%**. Faster? No.\nBetter cache retention? Yes. Know which problem you're solving.\n\n**Tier it.** GPU HBM \u2192 CPU RAM offload \u2192 distributed KV store over RDMA (Mooncake, LMCache).\nOne production setup pools a large slice of every GPU's memory into a shared KV store, so a\nlocal miss can be served from a peer's memory instead of recomputing the prefill. Over two\ndays, prompt tokens came ~81% from the local cache, ~15% from the remote store, ~3% computed.\n\n**Failure mode you must know: tiers degrade silently.** In that setup a failed remote lookup\nreturns a 0-token hit and the request just recomputes. **Remote KV problems show up as a lower\ncache hit rate and a higher TTFT, never as errors.** Watch hit rate per source, not error rate.\n\n## 2. Prefix caching \u2014 the biggest lever in real workloads\n\n**How it works.** The engine hashes the prompt in blocks (vLLM: hash per KV block; SGLang:\nradix tree over tokens). A new request reuses KV for its **longest matching prefix** and\nprefills only the rest. The first difference invalidates everything after it.\n\n**Three layers must cooperate:**\n1. **The prompt** must be byte-stable at the front: static system prompt and *sorted* tool\n   definitions first, dynamic content (timestamps, user turn) last. Lab 2.1 breaks this on purpose.\n2. **The router** must send the same prefix to the replica that holds it. Production routers use\n   cache-aware-by-hash + session affinity. Under load they deliberately move traffic off\n   \"hot\" workers (routing reason `cache_miss_all_hotspots`): load balance vs hit rate is a\n   tunable trade-off, not a bug.\n3. **The engine** must actually retain and reuse the KV. Not guaranteed (see below).\n\n**Hybrid models break the naive picture.** For Mamba/linear-attention layers there is no\nper-token KV to reuse. The engine must keep snapshots of the recurrent state at prefix\nboundaries. On Qwen3.5 in SGLang, the default `--mamba-scheduler-strategy no_buffer` keeps no\nsuch snapshots, so **prefix caching hit 0% on every stock config, including the certified one**.\n`--mamba-scheduler-strategy extra_buffer` allocates buffers for the state snapshots (and enables\nthe overlap scheduler and radix cache with speculative paths). Result: 0% \u2192 ~98% hit on repeats,\nTTFT on a 100k-token prompt 16.5 s \u2192 4.1 s, decode 161 \u2192 196 tok/s.\nvLLM's equivalent idea: `--prefix-cache-retention-interval` keeps resumable checkpoints for\nsliding-window/Mamba groups only every N tokens, so **a \"hit\" can resume up to N tokens short\nof the true shared prefix**.\n\n**Measure it right.** Token-weighted: \u03a3 cached_tokens \u00f7 \u03a3 prompt_tokens, over successful\nrequests only. Per-request averages overweight tiny requests. Enable cache reporting in the\nengine (`--enable-cache-report` in SGLang) or you'll see `cached_tokens=0` and wrongly conclude\ncaching is broken.\n\n**Cache economics change comparisons.** A customer's old model showed 127k input tok/s on\n4\u00d7H100. That was ~90% cache-hit economics on standard attention, where a cached prefix is nearly\nfree. Cache-normalized, the new hybrid model did ~27k *uncached* tok/s on 2 GPUs vs ~13k on 4.\nAlways compare uncached throughput, or the cache rate hides the real result.\n\n## 3. Speculative decoding\n\n**Idea:** decode is bandwidth-bound, so the GPU has spare compute. A cheap proposer drafts k\ntokens; the target model verifies all k in **one** forward pass and keeps the longest prefix it\nagrees with (plus one corrected token). With correct rejection sampling, the output distribution\nequals the target model's: it's lossless.\n\n| Proposer | How | Notes |\n|---|---|---|\n| Draft model | Small model of the same family | Simple; needs a matching tokenizer |\n| EAGLE / EAGLE3 | Light head on the target's hidden states | High acceptance; common in TRT-LLM and vLLM |\n| MTP heads | Multi-token-prediction heads trained with the model (DeepSeek-V3 and others) | No separate model to serve |\n| n-gram / prompt lookup | Copy spans from the prompt | Great for edits, RAG, code; free |\n| Model-specific drafters (e.g. DFlash) | Custom draft models/kernels per model family | Check acceptance per workload |\n\n**What decides the win: acceptance rate \u00d7 cost per step.** One large MoE in production: 5 draft tokens,\n~3.1 accepted per step, so each streamed chunk carries ~3 tokens. Gains shrink at high batch\n(compute is no longer free) and with unpredictable output. That's why configs scale draft length\nwith batch size. One production config used 2 spec tokens at batch 1\u20134 and 3 at batch 5\u201332.\n\n**Spec decoding interacts with everything.** A real crash: drafts were zero-padded to a fixed\nlength for CUDA-graph capture, and the **guided-decoding (structured output) bitmask path tripped\nover the padded positions inside the EAGLE3 loop**, crash-looping prefill pods only. Upstream had\nalready fixed it, and the fix was a backport (case study 4). When spec decoding is on, test it\nwith tool calling / JSON mode / long context, not just plain chat.\n\n## 4. Parallelism\n\n| Strategy | Splits | Communication | Use when | Production example |\n|---|---|---|---|---|\n| **TP** (tensor) | Each weight matrix across GPUs | All-reduce every layer (needs NVLink) | Model doesn't fit one GPU, or you need lower latency | TP8 inside one 8-GPU node |\n| **PP** (pipeline) | Layers across GPUs/nodes | Activations between stages; pipeline bubbles | Across nodes without fast interconnect | Rare for latency-sensitive serving |\n| **EP** (expert) | MoE experts across GPUs | All-to-all dispatch/combine per MoE layer | Large MoE; pairs with TP or DP-attention | TP8 + EP on a large MoE |\n| **DP** (data) | Whole replicas | None between replicas | Scale throughput; the default unit of scaling | Every fleet |\n| **DP-attention** | Attention by DP, MoE by EP | All-to-all | MLA models (latent KV doesn't shard across TP heads) | DeepSeek-style serving |\n| **Context parallel** | Sequence/KV across GPUs | Ring/all-to-all on attention | Very long context decode | Long-context MoE decode |\n| **Multi-node TP** | TP across nodes over NVLink fabric | MNNVL all-gather / reduce-scatter | Rack-scale systems (GB300 NVL72) | TP8 across two 4-GPU rack-scale nodes |\n\n**Same GPUs, different trade-off (real data):** on 2\u00d7B200, two TP1 replicas served ~980 req/min\nbut at **TTFT p50 8.7 s**, while one TP2 replica served 814 req/min at **0.9 s**. TP1\u00d7N wins raw\nrequests per GPU; TP2 wins latency. The customer's SLO decides, not the benchmark.\n\n**Pair rule (operational consequence of multi-node TP):** if one engine spans a leader pod and\na follower pod, losing *either* takes the whole engine down, and rolling one without the other\nleaves a stale half. Treat the pair as the unit of scheduling, rollout and alerting.\n\n## 5. Quantization\n\n| Format | What's quantized | Wins | Notes |\n|---|---|---|---|\n| FP8 (E4M3) weights (+activations, W8A8) | Weights, often activations | ~2\u00d7 less memory and bandwidth vs BF16; FP8 tensor cores on Hopper+ | Default choice for serving large models today |\n| NVFP4 / FP4 | Weights (+activations) | ~4\u00d7 vs BF16; Blackwell FP4 tensor cores | Common for frontier MoEs on Blackwell |\n| MXFP4 | Weights | Similar to FP4 | gpt-oss ships this way |\n| INT4 AWQ / GPTQ | Weights only | Big memory win for bandwidth-bound decode | Compute still in 16-bit; weaker at high batch |\n| KV-cache FP8 | KV cache | 2\u00d7 KV capacity \u2192 concurrency/context, better retention | Validate long-context quality |\n\n**What quantization buys you:** less memory (fit on fewer GPUs, bigger KV pool), less bandwidth\n(faster decode), and on Blackwell more FLOPs (faster prefill). It doesn't fix a scheduler or\ncache problem. The Qwen3.5 FP8 model fits a single B200 (~123 GB weights) with ~28 GB of KV\nheadroom, enough for a working deployment but not for high concurrency at long context.\n\n**Validate quality every time:** task evals for the use case, tool-calling conformance (we run a\n57-test function-calling suite on every config variant), long-context retrieval, and a few\ngolden prompts compared side by side. \"Same speed, quietly worse answers\" is the failure mode.\n\n## 6. Prefill/decode (P:D) disaggregation\n\n**Why:** prefill (compute-heavy, bursty) and decode (bandwidth-heavy, steady) interfere on the\nsame GPU. A big prefill stalls everyone's decode (ITL spikes). Splitting them into separate\nengine pools lets you size and tune each for its own bottleneck.\n\n**How (NVIDIA Dynamo pattern):** frontend with a KV-aware router \u2192 pick the prefill engine\nwith the most cached prefix blocks \u2192 prefill \u2192 transfer KV to a decode engine over RDMA (NIXL;\nmeasured p50/p95 ~17\u201335 / 40\u201364 ms) \u2192 decode streams tokens. Optionally, a shared KV store\nacross prefill engines (Mooncake) raises the cache hit rate further (~95% vs ~78% without it,\nin one pair of fleets).\n\n**When it pays off:** long prompts and high scale (prefill-dominated workloads), strict ITL SLOs,\nvery large models. When it doesn't: short prompts, small fleets, teams without the operational\nmaturity. It adds components (frontends, KV transfer, partitions, pair rules), and each one is\na new failure mode: requests stuck in a frontend queue, NIXL transfer failure loops, decode\nrollouts that drop sessions.\n\n**Setting the P:D ratio (worked example):** prompts p50 ~100k tokens, output p50 ~250\u2013280\ntokens, ~95% cache hit, ~35 RPS.\n- Uncached prefill per request \u2248 5% \u00d7 100k = 5k tokens of real compute, and **every** request\n  still pays KV transfer and lookups.\n- Decode per request is short (~280 tokens) but must stream smoothly at batch.\n- Production settled at roughly **2 prefill : 1 decode** on one hardware generation. On a\n  different generation with no shared KV store (more recompute), the ratio was rebalanced from\n  1:1 to roughly 1:2 within days as real traffic arrived.\n\nThe method: measure prefill queue time vs decode running batch per engine, then move capacity to\nwhichever side is queueing. The ratio is a measured outcome, not a formula.\n\n## 7. MoE kernel tuning (the free win people miss)\n\nFused MoE kernels (Triton) load a tuned config keyed by expert shape, GPU, dtype, block shape\nand Triton version. If the file is missing, the engine logs `Using default MoE kernel config.\nPerformance might be sub-optimal!` and leaves real throughput on the table. Fix: run the\nengine's tuning script (`benchmark/kernels/fused_moe_triton/tuning_fused_moe_triton.py` in SGLang,\n`benchmarks/kernels/benchmark_moe.py` in vLLM) on the **same GPU, TP size and dtype**, ship the\nJSON with the deployment, confirm `Using configuration from \u2026 for MoE layer` at startup, and\nA/B throughput. Re-tune on any GPU / dtype / Triton / model-revision change.\n\n## 8. Sizing worksheet (solve on paper, then check with `kv_calc.py`)\n\nAssume mem_fraction 0.9 and ignore activations. Answers are at the end.\n\n1. Llama-3.3-70B on 2\u00d7H100 (80 GB), 8k context. BF16 weights? FP8 weights? FP8 weights + FP8 KV?\n2. Qwen3-32B on 1\u00d7H100, 32k context. BF16? FP8?\n3. DeepSeek-V3 (671B, MLA) FP8 on 8\u00d7H200 (141 GB) at 128k context. Then on 8\u00d7H100.\n4. Llama-3.1-8B on 1\u00d7H100 at 128k context: how many users?\n5. A hybrid model holds ~144 MB of recurrent state per running sequence (fp32). With 44 GB left\n   after weights, how many sequences fit by state alone? What happens with bf16 state?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. BF16: weights 141 GB, KV budget ~2.8 GB \u2192 **1 sequence**: it fits on paper but is useless.\n   FP8 weights: 73 GB budget \u2192 ~224k tokens \u2192 **~27 sequences**. + FP8 KV \u2192 **~54**.\n2. BF16: 65.6 GB weights, 6.4 GB budget, can't hold even one 32k sequence (8.6 GB) \u2192 **0**.\n   FP8: 39 GB budget \u2192 **4** sequences at 32k. Long context is a KV problem, not a weights problem.\n3. 8\u00d7H200: 671 GB weights, ~344 GB budget, ~69 KiB/token \u2192 ~4.9M tokens \u2192 **~37 sequences**\n   at 128k on paper. Caveat: under pure TP, MLA's latent KV is *replicated* on every rank (it\n   can't be sharded by heads), so real capacity is far lower. That's why DP-attention exists.\n   8\u00d7H100: weights exceed memory \u2192 **doesn't fit**; use more nodes or FP4.\n4. 128 KiB \u00d7 131,072 = 17.2 GB per user; 56 GB budget \u2192 **3 users**. This is why long-context\n   products are expensive.\n5. 44 GB \u00f7 0.144 GB \u2248 305 slots; but engines with snapshot buffers need several slots per\n   running request (ratio 4\u20135 on Qwen3.5) \u2192 ~60\u201375 running. bf16 state (~73 MB) roughly\n   doubles it. This exact math explained why a config asking for 128 running requests got 15\u201322.\n\u003c/details>\n\n---\n\n## Labs\n\n### Lab 2.1 \u2014 Prefix caching, working and broken\n\n```bash\nMODEL=deepseek-ai/DeepSeek-V4.1-Flash python3 labs/prefix_cache.py --reps 4\nMODEL=zai-org/GLM-5.3-Flash          python3 labs/prefix_cache.py --reps 4\nMODEL=Qwen/Qwen3.5-9B                python3 labs/prefix_cache.py --only warm   # control: no cached pricing\n```\n\n1. `warm`: request 1 should be cold, requests 2+ should hit. What hit % do you get? Why not 100%?\n   (the tokens after the shared prefix, plus template tokens)\n2. `key=off` vs `key=on`: does `prompt_cache_key` raise the hit rate on a shared fleet? Explain\n   it in routing terms (affinity \u2192 same replica \u2192 warm cache).\n3. `timestamp@top` vs `@bottom`: explain the result with \"the earliest change invalidates\n   everything after it\".\n4. `tools:shuffled` vs `sorted`: why does tool order matter? (tools are rendered into the prompt\n   by the chat template)\n5. Write the 3 rules you'd give a customer whose agent gets a 20% cache hit rate.\n\n### Lab 2.2 \u2014 Observe speculative decoding\n\n```bash\npython3 labs/spec_probe.py --reps 3\nMODEL=moonshotai/Kimi-K3.1-Pro python3 labs/spec_probe.py --reps 3\n```\n\nCompare decode TPS and tokens/chunk for copy vs creative vs random-words. Explain the gap via\nacceptance rate. If there's no gap, give two possible reasons.\n\n### Lab 2.3 \u2014 Memory math\n\nSolve \u00a78 on paper first, then check each answer with `labs/kv_calc.py`. Then size the model\nyour favorite customer runs, from its `config.json` on Hugging Face.\n\n### Lab 2.4 \u2014 Read the source\n\n- vLLM spec decode: `vllm/v1/spec_decode/` (find where draft tokens are verified and accepted).\n- TRT-LLM EAGLE3: `tensorrt_llm/_torch/speculative/eagle3.py` and `drafting_loops.py` in\n  https://github.com/NVIDIA/TensorRT-LLM (find where draft tokens are padded for CUDA graphs).\n- vLLM retention interval: `vllm/config/cache.py` (`prefix_cache_retention_interval`).\n\n---\n\n## Self-check\n\n1. A customer's cache hit rate dropped from 95% to 60% with no deploy. List four causes in order\n   of likelihood and the signal for each. *(replica count change / not-ready pods, router hotspot\n   shedding, KV-store master restart, workload shape change, prompt-ordering change on their side)*\n2. Why can FP8 KV improve cache hit rate without improving throughput?\n3. When does speculative decoding make things *slower*?\n4. 2\u00d7TP1 or 1\u00d7TP2 for a customer with a 400 ms TTFT p50 SLO? Why?\n5. Explain P:D disaggregation to an engineering manager in three sentences, including the cost.\n\n**Explain it out loud (2 min):** \"A customer wants to cut cost by 40% without hurting latency.\nWalk me through the levers you'd evaluate, in order, and how you'd prove each one worked.\"\n"}, "03_models_gateways_harnesses.md": {"label": "03 \u00b7 Models & Gateways", "md": "# 03 \u2014 Models, Gateways & Harnesses\n\n**Goal:** reason about *which* open model fits a use case, read an architecture from its\nconfig, and understand the gateway layer between the API and the engine, because that layer\nis where many \"the model is broken\" reports actually come from.\n\n**Deliverables for this module**\n1. `tool_calls.csv` across 3 models, with every FAIL explained by a hypothesis about which layer dropped it.\n2. A model-selection scorecard for one realistic use case (\u00a73), backed by your own measurements.\n3. Architecture notes for 3 models read from their `config.json` (\u00a72).\n\n---\n\n## 1. The open-model landscape (snapshot: Nov 2026, re-check monthly)\n\n| Family | Current examples | Known for | Architecture notes |\n|---|---|---|---|\n| **Moonshot Kimi** | K2.6, K2.7 Code, K3, K3.1 Pro | Frontier agentic/coding, 1M context, Together's recommended chat & reasoning pick (K3.1 Pro) | Large MoE; K3 is hybrid (KDA linear attention + full attention); served NVFP4 |\n| **Z.ai GLM** | GLM-5.2, 5.3, 5.3 Flash | Coding agents (5.3 recommended), function calling at volume (5.3 Flash) | MoE; thinking on by default; FP4 on serverless |\n| **Qwen** | Qwen3.5 (9B \u2192 397B-A17B), 3.6, 3.7, 3.8 | Widest size range, strong multilingual, the default fine-tuning base | Qwen3.5 is hybrid (Gated DeltaNet + attention) \u2192 needs hybrid-aware engine settings |\n| **DeepSeek** | V4 Pro, V4.1 Flash | Strong reasoning per dollar, extremely cheap cached input | MoE; the V3 line introduced MLA (tiny KV per token) and MTP heads. Check each new release's config |\n| **MiniMax** | M3.1, M3.1 Flash | 1M context at low price | Large MoE |\n| **OpenAI gpt-oss** | 120B (20B for fine-tuning/dedicated) | Open-weight reasoning with an effort knob | MoE, ships MXFP4 |\n| **Meta** | Llama 4 Scout/Maverick, Muse Spark Open 816B-A42B, Muse Glimmer 30B | Ecosystem, multimodal, long context | MoE (Llama 4, Muse Spark) |\n| **Google Gemma 4** | 31B, 26B-A4B | Efficient small/mid models, VLM variants | Dense and MoE variants (the Gemma line uses interleaved sliding-window attention; verify in config) |\n| **NVIDIA Nemotron 3.5** | Super VL, Lightning | Vision-language, efficient | Hybrid / VL variants |\n\nAlways cross-check against the live catalog (https://docs.together.ai/docs/serverless/models)\nand Together's recommended-models page (https://docs.together.ai/docs/inference/recommended-models).\nStrength claims age fast; measure on the customer's task before recommending anything.\n\n## 2. Architecture patterns, and why each matters for serving\n\n| Pattern | What to look for in `config.json` | Serving consequence |\n|---|---|---|\n| Dense | no expert fields | Compute \u221d all params; simplest to serve |\n| MoE | `num_experts` / `n_routed_experts`, `num_experts_per_tok` | Memory \u221d total params, compute \u221d active; needs EP at scale; MoE kernel tuning; load imbalance across experts |\n| GQA | `num_key_value_heads` \u003c `num_attention_heads` | Smaller KV \u2192 more concurrency |\n| MLA | `kv_lora_rank`, `qk_rope_head_dim` | Tiny KV; latent replicated under TP \u2192 DP-attention |\n| Sliding window | `sliding_window`, layer-type lists | KV capped per layer; prefix reuse needs retention checkpoints |\n| Hybrid linear attention (Mamba / GDN / KDA) | `layer_types` / `linear_attn` configs, `mamba_*` | Fixed recurrent state per sequence; prefix caching needs state snapshots; silent concurrency caps |\n| MTP heads | `num_nextn_predict_layers` | Built-in speculative decoding |\n| Long-context RoPE scaling | `rope_scaling` / `rope_parameters` (YaRN) | Engines must read it correctly (a real TRT-LLM fix: reading transformers-5 `rope_parameters` for YaRN) |\n| Multimodal | `vision_config`, image token limits | Image preprocessing cost, per-request image caps, payload size limits |\n| Reasoning | chat template thinking markers | Reasoning tokens bill as output; TTFT must count them; reasoning parser required |\n\n**Exercise:** open the `config.json` of three models on Hugging Face (one dense, one MoE + MLA,\none hybrid) and fill this table for each: total/active params, layers, KV heads \u00d7 head_dim (or\nMLA dims), attention type per layer, context length, and the one serving risk it implies.\n\n## 3. Model selection framework (what an FDE/SA actually does)\n\n1. **Requirements first:** task type, quality bar (how measured), latency SLO (TTFT/TPS), context\n   length, tool calling / JSON needs, languages, modality, data/licensing constraints, volume, budget.\n2. **Shortlist 3:** a frontier pick, a cost-efficient pick, a small/fast pick.\n3. **Measure, don't assume:** a 20\u201350 example eval on *their* data, plus `bench.py` (latency at\n   their prompt shape), `tool_calls.py` (conformance), and `prefix_cache.py` (cacheability).\n4. **Cost model:** (input tokens \u00d7 (1 \u2212 cache rate) \u00d7 input price) + (input \u00d7 cache rate \u00d7 cached\n   price) + (output tokens \u00d7 output price), per request, \u00d7 volume. Then compare with a dedicated\n   endpoint: GPU-hours \u00d7 price for the replicas needed to hold the SLO at peak.\n5. **Deployment option:** serverless (best-effort, pay per token) \u2192 dedicated endpoint (reserved\n   GPUs, predictable latency, custom weights, opt-in optimizations) \u2192 provisioned throughput\n   (committed throughput). Volume and SLO strictness move you right.\n6. **Write it down** as a one-page recommendation: winner, runner-up, numbers, risks, and what\n   you'd re-test after launch.\n\n**Scorecard template**\n\n| Model | Task score (n=\u2026) | TTFT p95 @ their shape | Decode TPS | Tool-call conformance | Cache hit | $ / 1k requests | Risks |\n|---|---|---|---|---|---|---|---|\n| | | | | | | | |\n\n## 4. Model gateways (SMG and friends)\n\nA gateway sits between clients and engines. In SMG (Shepherd Model Gateway, Rust, open source):\n\n```\nrequest \u2192 auth / admission \u2192 chat template \u2192 tokenize \u2192 ROUTE (pick worker)\n        \u2192 engine generate (gRPC or HTTP) \u2192 detokenize \u2192 reasoning parser \u2192 tool-call parser \u2192 SSE\n```\n\n**What it owns, and how each piece fails in production:**\n\n| Responsibility | Production failure we've seen |\n|---|---|\n| Protocol adaptation (OpenAI / Anthropic / Responses \u2192 engine) | A request parameter (`parallel_tool_calls`) was **accepted (200) but on the excluded-fields list for every backend**, so it never reached the engine. LangChain sends it by default, so agents fired 2\u20136 tool calls with real side effects. |\n| Request validation | Truncated tool-call arguments in conversation *history* triggered **7,489 consecutive 400s** for one agent client. Fix: repair or default malformed history args instead of rejecting the whole request. |\n| Body limits | An oversized body got a fast 413 from the gateway, which closed the connection while the router was still uploading, so **the client saw a 500** (`BodyWrite \u2026 Broken pipe`). Always check for a 413 on the same request id. |\n| Routing policy | Cache-aware routing kept sending traffic (and new sessions) to workers on a node with broken pod networking, even after ~7,850 health-check failures per worker per day: no ejection. |\n| Health / circuit breaking | With the circuit breaker disabled, a bad worker is removed only after the health-check threshold (e.g. 10 \u00d7 20 s \u2248 3+ min). Every request in that window fails. |\n| Parsers (reasoning, tool calls) | Each model family needs its own parser; a wrong or outdated one corrupts tool calls without erroring. |\n| Admission (per-org fair queues) | 429s from the gateway mean admission rejection, not engine overload. Read the error code before blaming capacity. |\n\n**Routing policies to know (SMG `model_gateway/src/policies/`):** `round_robin`, `random`,\n`power_of_two` (pick the less loaded of two), `cache_aware` (prefix-tree affinity with load\nthresholds), `prefix_hash` / `consistent_hashing` (deterministic affinity), `dp_min_token`\n(DP-attention aware), `bucket`, `manual`. Production forks often add cost-aware and session-aware\nvariants with hotspot detection. The core trade-off: **cache affinity vs load balance**.\n\n**Other gateways you'll meet:** LiteLLM (multi-provider proxy), Envoy AI Gateway, provider SDK\nrouters, and Dynamo's own frontend (KV-aware routing inside a disaggregated fleet).\n\n## 5. Chat templates are code\n\nThe chat template turns `messages + tools` into the exact token sequence the model was trained\non. It decides where tool definitions go, how reasoning is marked, and which flags are honored.\n\n- A tool flag (`defer_loading: true`) was meant to keep deferred tools out of the prompt. Our\n  servers ignored it, so the prefix changed every request and **cached tokens dropped to 0**.\n  Pinning it down took comparing **8 revisions** of the official template against what we served.\n- Template-added tokens explain why a \"fully shared\" prompt never reaches 100% cache hit.\n- Some gateways can render tools exactly like `vllm serve` does (a match-vLLM mode) to avoid\n  subtle prompt differences between serving paths.\n\n**Rule:** version-pin the template with the model revision, diff it on every upgrade, and test\ntool calling + caching after any template change.\n\n## 6. Harnesses (coding agents and agent frameworks)\n\nAgent harnesses (Claude Code, Codex, OpenCode, Pi, LangGraph, custom loops) are the heaviest\nusers of an inference API. What they stress:\n\n- **Very long, mostly-static prefixes** \u2192 cache hit rate is everything; the ordering rules from\n  module 02 (static first, sorted tools, timestamps last) decide the bill and the TTFT.\n- **Tool calling fidelity**: parallel calls, `tool_choice`, streamed argument fragments, orphan\n  tool-call ids in history. Servers differ in strictness. A 57-test conformance suite showed the same 3\n  strictness failures across every config of one model, so that's a model/gateway trait, not a config bug.\n- **Protocol surface**: OpenAI Chat Completions, Responses (`previous_response_id`, server-side\n  history), Anthropic Messages (`cache_control` is a no-op on Together because caching is automatic).\n- **Long sessions** \u2192 session affinity in the router, and graceful handling of client disconnects (499s).\n\n---\n\n## Labs\n\n### Lab 3.1 \u2014 Conformance across models\n\n```bash\nMODEL=zai-org/GLM-5.3-Flash        python3 labs/tool_calls.py\nMODEL=moonshotai/Kimi-K3.1-Pro     python3 labs/tool_calls.py\nMODEL=deepseek-ai/DeepSeek-V4.1-Flash python3 labs/tool_calls.py\n```\n\nFor every FAIL with `http=200`, write a hypothesis about which layer is responsible: model\nbehaviour, chat template, gateway protocol adaptation, or parser. How would you prove it?\n(Hint: compare streaming vs non-streaming, and compare the same model through two serving paths.)\n\n### Lab 3.2 \u2014 Selection scorecard for a real use case\n\nPick a use case, e.g. *\"customer-support agent: ~3k-token system prompt + 4 tools, replies under\n200 tokens, TTFT p95 \u003c 1.5 s, 50 RPS peak\"*. Write 20 test prompts with expected behaviour. For\n3 models, run `bench.py --prompt-tokens 3000 --max-tokens 200 --cache shared`, `tool_calls.py`,\nand your 20 prompts. Fill the \u00a73 scorecard, compute $/1k requests from catalog prices, and\nwrite the one-page recommendation.\n\n### Lab 3.3 \u2014 Run a gateway yourself (optional, no GPU)\n\nRun SMG (https://github.com/lightseekorg/smg) in front of Ollama on a laptop, or in front of\nvLLM on one GPU. Change the routing policy between `round_robin` and `cache_aware`, rerun the same\nmulti-turn traffic, and compare cache hit rate and latency.\n\n### Lab 3.4 \u2014 Read the gateway source\n\nIn https://github.com/lightseekorg/smg:\n- `model_gateway/src/policies/cache_aware.rs`: when does it break affinity to balance load?\n- `model_gateway/src/routers/grpc/pipeline.rs`: the per-request pipeline stages.\n- `crates/tool_parser/src/parsers/` (e.g. `glm4_moe.rs`, `kimik2.rs`, `qwen.rs`): how a raw\n  model output becomes a `tool_calls` array.\n- `model_gateway/src/routers/http/router.rs`: retries and worker selection on the HTTP path.\n\n---\n\n## Self-check\n\n1. A customer says \"Kimi ignores `parallel_tool_calls=false`\". List the layers a request crosses\n   and how you'd find the one that drops the flag.\n2. Why does an MoE model with 10B active parameters still need ~120 GB of GPU memory in FP8?\n3. What's the first thing you check when a hybrid model shows 0% cache hit?\n4. A customer wants \"the best model for coding agents\" at the lowest cost. Walk through your method.\n5. Why can a gateway 429 and an engine 503 call for completely different fixes?\n\n**Explain it out loud (2 min):** \"What does a model gateway do, and tell me about a time the\ngateway, not the model, was the root cause.\"\n"}, "04_production_lifecycle.md": {"label": "04 \u00b7 Production", "md": "# 04 \u2014 Production & Customer Lifecycle\n\n**Goal:** take a model from \"it works in a test\" to \"it survives real traffic, we know when\nit's sick, we can change it safely, and the customer trusts what we tell them.\"\n\n**Deliverables for this module**\n1. A `monitor.py` run (\u2265 10 min) with an SLO verdict and per-minute buckets.\n2. A production readiness review (PRR) for the \u00a77 scenario, using the template.\n3. An alert set for the \u00a77 scenario with thresholds and the reasoning behind each number.\n4. Three incident drills completed out loud (Lab 4.2) with your written timeline.\n\n---\n\n## 1. Production readiness: the checklist before real traffic\n\n| Area | Question | Evidence that answers it |\n|---|---|---|\n| Correctness | Do tool calls, JSON mode, reasoning, long context and multimodal work on *this* config? | Conformance suite pass list, golden-prompt diffs, long-context ladder |\n| Performance | Does it hold the SLO at peak, with the customer's real request shape? | Open-loop load test at 1.0\u00d7 and 1.5\u00d7 peak, with cache behaviour like production |\n| Capacity | How many replicas for peak + failure headroom, per failure domain? | Sizing sheet (\u00a72) |\n| Effective limits | What did the engine *actually* allocate? | Startup logs: max running requests, KV tokens, state slots (configs lie) |\n| Startup | How long from pod scheduled \u2192 serving? | Measured: image pull + weight load + warmup (big MoE: 10\u201315 min) |\n| Failure behaviour | What happens when a replica, node or cluster dies mid-traffic? | Kill test or a documented failover path; router ejection time |\n| Observability | Can we see RPS, TTFT, decode TPS, errors by code, cache hit, queue and ready-vs-desired? | Dashboard + alert links in the runbook |\n| Rollback | How do we undo a bad change in minutes? | Previous config/deployment still available; documented steps |\n| Ownership | Who's paged, and who owns each layer? | Alert labels + routing, escalation map |\n\n**Two production gotchas that belong on every checklist:**\n- **Configs are often immutable once deployed** (a new config = a new deployment, i.e. blue/green).\n  Plan rollouts around that instead of expecting an in-place patch.\n- **Idle test deployments get swept** (an inactivity sweeper stopped ours after ~1 h without\n  traffic). A load test against a stopped deployment measures nothing.\n\n## 2. Capacity sizing from measured numbers\n\n1. Measure **sustainable throughput per replica at the SLO** (not at saturation): requests/min,\n   input tok/min, output tok/min at the TTFT/TPS target, with realistic cache behaviour.\n2. Get the customer's **peak** demand in the same units (tokens per minute is the most honest\n   unit; RPS hides prompt size).\n3. Replicas = peak \u00f7 per-replica sustainable \u00d7 headroom (1.2\u20131.5), then round up **per failure\n   domain** (cluster, region), so losing one domain doesn't breach the SLO.\n4. Re-check after launch: measured TPM per GPU on real traffic beats any synthetic estimate.\n\n**Real example:** an older endpoint was sized for ~3.9B tokens/min but actually needed ~1B; a\nnewer one needed to grow to ~3B. Sizing from measured tokens-per-GPU freed **728 GPUs (182\npods)** and moved them to the endpoint that needed them, placed deliberately on one cluster\nrather than spread blindly. A standing GPU target for the growing endpoint (1,300 GPUs) became\nthe team's overshoot check.\n\n**Customer-facing sizing example:** target 1,432 req/min at TTFT p50/p95 400/883 ms. One\noptimized replica sustained 814 req/min at TTFT p50 0.9 s \u2192 2 replicas clear the throughput\ntarget, and 3 replicas at lower per-replica load are needed for the strict latency band. Give\nthe customer both numbers and let them choose the trade-off.\n\n## 3. Rollouts: change things without breaking them\n\n| Technique | What it is | Use for |\n|---|---|---|\n| **Canary** | Roll one unit, verify, then fan out | Every image/config change |\n| **Blue/green** | New deployment alongside old; shift traffic; keep old for rollback | Immutable configs; engine/model swaps |\n| **Traffic split / weighted routing** | Send x% to the new version | Gradual migrations, A/B on real traffic |\n| **Shadow traffic** | Mirror real requests to a test deployment, drop its responses | Testing optimizations on real shapes with zero customer risk |\n| **Rolling restart in batches** | Replace k units at a time, keep capacity \u2265 floor | Template changes on large fleets |\n\n**Rules learned the hard way (from large disaggregated fleets):**\n1. **Canary first, even when you fan out per group.** Rolling one unit in *each* rack at once\n   means a bad image degrades every rack simultaneously, which is strictly worse than one rack down.\n2. **Respect the unit of failure.** If one engine is a leader + follower pod pair, roll both\n   together; deleting one leaves a stale half.\n3. **Never combine a roll with a replica-count change** or a second template change on the same\n   group; the scheduler's ordering gets confounded.\n4. **Verify each batch end to end before the next:** pods Ready *and* registered with service\n   discovery *and* one real request served through the new unit. Kubernetes Ready is not \"serving\".\n5. **Batch size = capacity floor you can afford.** E.g. 2 of 6 frontends at a time (\u2265 66%\n   capacity), 1 per rack where a rack has a single frontend.\n6. **Don't restart stuck workers on live traffic blindly.** Replaying stuck requests once caused\n   621 client cancellations (499s). Drain or shift traffic first.\n7. **Exclude shadow traffic from customer metrics.** Mirrored requests appear in request logs\n   under the customer's org; one endpoint's \"errors\" were inflated by ~800k shadow 429s.\n   Filter by deployment id or a shadow request-id marker.\n\n**Abort criteria (decide before you start):** 5xx above baseline for N minutes, TTFT p95 > X,\nany pod crash-looping, cache hit rate drop > Y points, or ready \u003c committed floor. Write them in\nthe change ticket.\n\n## 4. Monitoring & alerting\n\n**The LLM golden signals:** RPS by status code \u00b7 TTFT p50/p95 \u00b7 decode TPS p50 \u00b7 5xx and 429\nrates (separately) \u00b7 cache hit rate \u00b7 engine queue (waiting requests) and KV usage \u00b7 preemptions \u00b7\nready vs committed replicas \u00b7 client cancellations (499).\n\n**A minimal alert set that worked for high-priority dedicated endpoints:**\n\n| Alert | Condition | Why this shape |\n|---|---|---|\n| Success rate \u003c 95% | 2xx / (non-4xx) over 10 m, per deployment, skip \u003c 0.2 RPS | Excludes client errors; ignores idle noise |\n| Sudden traffic cutoff | 5 m RPS \u003c 20% of trailing 30 m baseline, baseline > 1 RPS | Catches \"customer failed over / can't reach us\", which error-rate alerts miss entirely |\n| Capacity below 85% of committed | ready \u00f7 committed replicas per role | Catches node loss before latency moves |\n| 5xx burst | 5xx > 1.5 RPS over 2 m | Fast signal for hard failures |\n| Worker stalled | per pod: waiting requests, 0 prompt + 0 generated tokens over 10 m | Catches hung engines that health checks still pass |\n\n**Alerting pitfalls we hit (each one is a good interview story):**\n- **Auto-resolved \u2260 fixed.** Error rate can dip under threshold during load-balancer convergence\n  while the capacity problem persists. If the customer says it's still failing, believe the customer.\n- **Absolute thresholds don't scale.** 1.5 RPS of 5xx is ~0.1% at 1,300 RPS but 100% at 1.5 RPS.\n  Re-derive thresholds when traffic changes by an order of magnitude.\n- **Percentage capacity alerts miss single-engine loss.** At 34 committed, \"\u003c 85%\" needs 6 engines\n  down. One crash-looping engine on a bad node can sit unnoticed for days.\n- **Probes and polling count as traffic.** Health checks and `/workers` polling (~1 RPS) make an\n  idle deployment look busy. Exclude them in every query.\n- **Routing policy can override severity.** A policy that pages on any `team=\u2026` label turns\n  warnings into pages. Set the receiver per rule.\n- **A dead metadata service may not trip any alert.** E.g. a KV-store master outage shows up only\n  as cache-hit loss and TTFT growth.\n- **Console status \u2260 customer impact.** \"DEGRADED\" with 492/512 ready is normal churn at scale;\n  check RPS and success rate before paging humans.\n\n## 5. Incident method: locate the layer with data\n\n1. **Confirm impact from the customer's side.** Edge success rate, the customer's own description,\n   client cancellations. Not the auto-resolved alert.\n2. **Split the signal.** By status code (429 \u2260 503 \u2260 504), by layer (edge vs engine), by cluster,\n   by deployment/revision, by pod, by node. A \"9% error rate\" can be 28% on a 15% canary and 0%\n   everywhere else.\n3. **Find a control group.** Old pods vs new pods, cluster A vs B, another edge sending to the same\n   clusters, another customer on the same fleet. A comparison ends arguments.\n4. **Check what changed.** Deploys, config revisions, scale events, node events, maintenance,\n   the customer's traffic shape.\n5. **Hypothesis + the signal that would confirm it.** Say both out loud. Kill hypotheses fast.\n6. **Mitigate before root-causing.** Roll back the canary, cordon the node, shift traffic. Don't\n   wait for a code fix to stop the bleeding.\n7. **Trace individual requests end to end.** Request id \u2192 router decision \u2192 engine pod \u2192 node \u2192\n   the *actual* engine error (not just \"HTTP 500\").\n8. **Correct yourself publicly** when new data contradicts an earlier claim.\n\n**TTFT ladder (stop at the first probe that lights up):**\nP1 edge vs engine TTFT (where is the latency?) \u2192 P2 engine crashes / restarts (hot-pod crash \u2192\ncold re-warm spike that self-heals in 15\u201330 min) \u2192 P3 capacity (ready replicas stepped down) \u2192\nP4 load (RPS or input-token surge; queue time \u226b prefill time) \u2192 P5 cache (hit-rate cliff without\nrestarts = routing/affinity or workload change) \u2192 P6 network/edge (health-check flaps, proxy-minted\nerrors, packet loss: ping and curl it from your laptop).\n\n**Status-code attribution cheat sheet**\n\n| Code | Usually means | First check |\n|---|---|---|\n| 429 | Admission / rate limit (per org or per key) | Which limiter, which org, request rate vs limit; quota formula |\n| 499 | Client gave up (timeout, cancel) | Did latency rise first? Baseline rate? |\n| 500 | Engine or gateway error, or a masked 413 | Engine log line for the request id; look for a 413 on the same id |\n| 502 | Upstream connection failed or dropped | Which hop; `http2: client connection lost` = proxy-side connection drop |\n| 503 | No healthy capacity / overload shed | Ready vs desired, warm-up lag, queue depth, circuit breaker |\n| 504 | Timeout between hops | Which timeout fired; unreachable node/pod (`No route to host`), slow dependency |\n\n**For every 5xx report:** request id(s), source engine pod, its node, and the actual engine error.\nCollapse duplicates into one row per pod + error.\n\n## 6. Customer communication\n\n- **Lead with a status table** (RPS, decode p50, TTFT p50/p95, 5xx, 4xx/429, capacity, a 2\u20133 line\n  note). Numbers first, narrative second.\n- **Holding update while still investigating:** what's affected, what isn't, what we're doing,\n  and when the next update comes. No blame, no guesses stated as facts, no \"it's fixed\" until\n  metrics confirm it.\n- **Translate, don't dump.** Customers want impact and action, not CUDA errors. Some contracts\n  forbid sharing infra details (GPU type, clusters, replica counts); keep to load, latency,\n  errors and cache rate.\n- **Close the loop:** post-incident summary with timeline (UTC), impact (requests, minutes),\n  root cause, mitigation, prevention, and what the customer can do (e.g. retry with backoff).\n\n**Holding update template**\n> We're seeing elevated latency and some errors on your endpoint since 14:12 UTC. Roughly half of\n> requests are affected; the rest complete normally. We've identified the affected capacity and\n> are moving traffic off it now. Next update by 14:45 UTC, or sooner if it clears.\n\n## 7. Scenario for the PRR and alert deliverables\n\n> A customer wants a dedicated endpoint for a support-agent product: ~4k-token shared system\n> prompt + ~1.5k tokens of conversation per turn, ~150-token replies, tool calling (6 tools),\n> peak 40 RPS during US business hours, TTFT p95 \u003c 1.5 s, 99.9% monthly success. They'll migrate\n> from another provider in two weeks and want zero-downtime cutover.\n\nWrite: (a) the PRR using \u00a71's table, (b) a sizing estimate with explicit assumptions (\u00a72),\n(c) the rollout/cutover plan with abort criteria (\u00a73), (d) the alert set with thresholds (\u00a74),\nand (e) the first customer message you'd send if the cutover canary shows 3% errors.\n\n---\n\n## Labs\n\n### Lab 4.1 \u2014 Synthetic monitor with an SLO verdict\n\n```bash\npython3 labs/monitor.py --duration 600 --interval 10 --slo-success 0.995 --slo-ttft-p95 2.0\n```\n\n1. Read the per-minute buckets. Is there a minute that's worse than the rest? Correlate it with\n   the time of day (shared serverless load).\n2. Take one failed probe's `request_id` from `labs/results/monitor.csv`. That id is what you'd\n   hand to support or trace through the platform.\n3. Run two monitors at once against two models. Which one is more stable, and how would you prove\n   it isn't noise? (longer window, percentiles, repeat at another hour)\n\n### Lab 4.2 \u2014 Incident drills (out loud, no AI)\n\nTime-box each drill to 15 minutes. Say which signal you'd pull, in order, and what each one would\nconfirm or rule out. Ideally a partner plays the system and reveals data only when you ask for it.\nThen open the outline and compare.\n\n**Drill A: slower, but nothing is failing.** TTFT p95 doubled since 09:00. No errors, request\nrate flat, prompt sizes unchanged.\n\n\u003cdetails>\u003csummary>Outline\u003c/summary>\n\nSplit edge vs engine TTFT first (it's engine-side). Restarts? None. Ready replicas? Up, not\ndown: someone added replicas at 09:00. Cache hit rate fell from ~90% to ~55%: with more workers,\nprefix affinity spreads thinner and the router sheds \"hot\" workers more often, so prompts land on\nreplicas without their cache. Mitigate: revert or retune affinity/hotspot settings, and give new\nreplicas time to warm. Lesson: a capacity *increase* can make latency worse.\n\u003c/details>\n\n**Drill B: one customer, 30% 400s.** Since yesterday one agent customer gets HTTP 400 on ~30% of\nrequests; every other customer is fine.\n\n\u003cdetails>\u003csummary>Outline\u003c/summary>\n\nGroup the 400s by error text and request shape, not by time. They all carry a conversation\nhistory with a truncated (invalid JSON) tool-call argument, which the gateway now rejects\nstrictly, and every follow-up in that session fails the same way. Workaround: the customer repairs\nor drops the bad turn. Fix: the gateway repairs or defaults malformed *history* arguments\ninstead of rejecting the whole request (case study 5's sibling).\n\u003c/details>\n\n**Drill C: 504s at exactly 20 seconds.** Bursts of 504s, all from one cluster, almost all at\n~20 s latency.\n\n\u003cdetails>\u003csummary>Outline\u003c/summary>\n\nA fixed latency is a timeout signature: two 10 s connect timeouts, from a retry hitting the same\ndead worker. Group failures by upstream worker: nearly all go to a few pods on one node. Errors\nare `No route to host` / connect timeouts, yet Kubernetes says the node is Ready (local probes\npass). Mitigate: cordon and drain the node. Follow up: pod-network root cause, and a router policy\nthat ejects workers after repeated health-check failures (case study 7).\n\u003c/details>\n\n### Lab 4.3 \u2014 Case-study replays\n\nFor case studies 2, 3, 7 and 8 in `05_case_studies.md`: read only the **Symptom**, write your\ninvestigation plan (signals, in order, with the hypothesis each tests), then read the rest and score yourself.\n\n---\n\n## Self-check\n\n1. An alert auto-resolved 5 minutes after firing; the customer says it's still broken. What do you do first?\n2. Design the abort criteria for rolling a new engine image across 3 clusters.\n3. Why is \"tokens per minute\" a better sizing unit than RPS?\n4. Name two failure modes that produce no 5xx at all, and the metric that catches each.\n5. Write a 3-line customer update for an incident where you don't yet know the root cause.\n\n**Explain it out loud (2 min):** \"Tell me about a production incident you led: how you found the\nfailing layer, how you
